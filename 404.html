<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#181721">
<title>Çizik — Sayfa bulunamadı</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F4D95'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' font-family='Arial' fill='%23E6EAEF' text-anchor='middle'%3E%C3%87%3C/text%3E%3C/svg%3E">
<style>
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#181721; color:#E6EAEF; font-family:Arial, Helvetica, sans-serif; text-align:center; padding:20px;}
  .k{max-width:420px;}
  .baslik{font-size:72px; font-weight:700; color:#0F4D95; line-height:1;
    text-decoration:line-through; text-decoration-thickness:6px; text-decoration-color:rgba(230,234,239,.6);}
  h1{font-size:22px; margin:18px 0 8px;}
  p{font-size:14px; color:#8b93a1; line-height:1.6; margin-bottom:22px;}
  a{display:inline-block; background:#0F4D95; color:#E6EAEF; text-decoration:none;
    padding:12px 26px; border-radius:8px; font-weight:700; font-size:15px;}
  a:hover{background:#0d417c;}
</style>
</head>
<body>
  <div class="k">
    <div class="baslik">404</div>
    <h1>Bu sayfa çizilip silinmiş</h1>
    <p>Aradığın sayfa ya hiç olmadı ya da çoktan çizildi ve kaldırıldı.<br>Hadi listene geri dönelim.</p>
    <a href="/">← Çizik'e dön</a>
  </div>
</body>
</html>
